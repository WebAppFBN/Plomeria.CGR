<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presupuestos · Plomería Jujuy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

        .ff-display { font-family: 'Oswald', sans-serif; }
        .ff-body { font-family: 'IBM Plex Sans', sans-serif; }
        .ff-mono { font-family: 'IBM Plex Mono', monospace; }
        .text-2xs { font-size: 10.5px; line-height: 1.3; }

        .paper-bg {
            background-color: #F2F4F3;
            background-image:
                linear-gradient(rgba(59,127,176,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,127,176,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .rotulo { background: #0F2A38; color: #EAF4F6; }
        .rotulo-cell { border: 1px solid rgba(234,244,246,0.25); }
        .rotulo-label { color: #D98A4E; }

        .dim-divider { display: flex; align-items: center; gap: 6px; margin: 26px 0 14px; }
        .dim-tick { width: 1px; height: 14px; background: #A9B8B8; flex-shrink: 0; }
        .dim-line { flex: 1; height: 1px; background: #A9B8B8; }
        .dim-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #5C6B6B;
            white-space: nowrap;
        }

        .tab-btn {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.04em;
            color: rgba(234,244,246,0.55);
            border-bottom: 3px solid transparent;
            padding-bottom: 4px;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            cursor: pointer;
            font-size: 14px;
        }
        .tab-btn[data-active="true"] { color: #EAF4F6; border-bottom-color: #B5652D; }

        @media print {
            body * { visibility: hidden; }
            #quote-preview, #quote-preview * { visibility: visible; }
            #quote-preview { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 20px; }
            .no-print { display: none !important; }
        }

        input, textarea {
            font-family: 'IBM Plex Sans', sans-serif;
        }
        input[type="number"] {
            font-family: 'IBM Plex Mono', monospace;
        }
        input:focus, textarea:focus {
            outline: 2px solid #B5652D;
            outline-offset: 1px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
    // ====== STORAGE WRAPPER ======
    const storage = {
        get: (key) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch { return null; }
        },
        set: (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch { return false; }
        },
        delete: (key) => {
            try {
                localStorage.removeItem(key);
                return true;
            } catch { return false; }
        }
    };

    // ====== CONSTANTES ======
    const PERFIL_KEY = "perfil";
    const PRECIOS_KEY = "precios-lista";
    const INDEX_KEY = "presupuestos-index";

    const CATEGORIES = [
        { id: "agua_fria", label: "Agua fría", color: "#3B7FB0", icon: "droplet",
            normativa: "Materiales certificados con la norma IRAM del material utilizado (PVC, PPR, cobre — IRAM 2609 para cobre). Los sistemas de sobrepresión/bombeo deben ajustarse a IRAM 2634." },
        { id: "agua_caliente", label: "Agua caliente", color: "#C1502E", icon: "droplet",
            normativa: "Mismo criterio que agua fría, sumando aislación térmica en tramos expuestos y válvula de seguridad certificada en termotanques." },
        { id: "cloacal", label: "Desagüe cloacal", color: "#8A7245", icon: "wrench",
            normativa: "Pendientes, diámetros y conexión a colectora sujetos al reglamento de instalaciones internas de Agua Potable y Saneamiento de Jujuy S.E. (APSJ), en el marco del Código de Aguas provincial (Ley 161)." },
        { id: "pluvial", label: "Desagüe pluvial", color: "#4C8A5E", icon: "wrench",
            normativa: "No debe interconectarse con la red cloacal. El destino final del desagüe pluvial se confirma con APSJ o el municipio." },
        { id: "gas", label: "Gas", color: "#C7A233", icon: "flame", warning: true,
            normativa: "La instalación, prueba y habilitación de gas es responsabilidad exclusiva de un gasista matriculado ante ENARGAS. Este presupuesto no reemplaza el proyecto ni la habilitación correspondiente." },
        { id: "reparacion", label: "Reparación / Mantenimiento", color: "#6B6B6B", icon: "wrench",
            normativa: "En intervenciones sobre instalaciones existentes, verificá que la reparación mantenga las condiciones habilitadas por APSJ." }
    ];

    const STARTER_PRICES = [
        { id: "p1", categoria: "agua_fria", nombre: 'Caño PPR/PVC 1/2" (barra 4m)', unidad: "u", precio: 0 },
        { id: "p2", categoria: "agua_fria", nombre: 'Caño PPR/PVC 3/4" (barra 4m)', unidad: "u", precio: 0 },
        { id: "p3", categoria: "agua_fria", nombre: 'Codo 90° 1/2"', unidad: "u", precio: 0 },
        { id: "p4", categoria: "agua_fria", nombre: 'Te 1/2"', unidad: "u", precio: 0 },
        { id: "p5", categoria: "agua_fria", nombre: 'Llave de paso 1/2"', unidad: "u", precio: 0 },
        { id: "p6", categoria: "agua_fria", nombre: "Tanque de reserva 500L", unidad: "u", precio: 0 },
        { id: "p7", categoria: "agua_fria", nombre: "Llave maestra / conexión de medidor", unidad: "u", precio: 0 },
        { id: "p8", categoria: "agua_caliente", nombre: 'Caño PPR termofusión 1/2" (barra 4m)', unidad: "u", precio: 0 },
        { id: "p9", categoria: "agua_caliente", nombre: "Termotanque a gas 60-80L", unidad: "u", precio: 0 },
        { id: "p10", categoria: "agua_caliente", nombre: "Termotanque eléctrico", unidad: "u", precio: 0 },
        { id: "p11", categoria: "agua_caliente", nombre: "Válvula de seguridad", unidad: "u", precio: 0 },
        { id: "p12", categoria: "agua_caliente", nombre: "Aislación térmica para caño", unidad: "m", precio: 0 },
        { id: "p13", categoria: "cloacal", nombre: "Caño PVC cloacal 110mm (barra 3m)", unidad: "u", precio: 0 },
        { id: "p14", categoria: "cloacal", nombre: "Caño PVC cloacal 63mm (barra 3m)", unidad: "u", precio: 0 },
        { id: "p15", categoria: "cloacal", nombre: "Codo 45° 110mm", unidad: "u", precio: 0 },
        { id: "p16", categoria: "cloacal", nombre: "Ramal simple 110mm", unidad: "u", precio: 0 },
        { id: "p17", categoria: "cloacal", nombre: "Cámara de inspección", unidad: "u", precio: 0 },
        { id: "p18", categoria: "cloacal", nombre: "Rejilla de piso", unidad: "u", precio: 0 },
        { id: "p19", categoria: "cloacal", nombre: "Sifón", unidad: "u", precio: 0 },
        { id: "p20", categoria: "pluvial", nombre: "Caño PVC pluvial 110mm (barra 3m)", unidad: "u", precio: 0 },
        { id: "p21", categoria: "pluvial", nombre: "Embudo pluvial", unidad: "u", precio: 0 },
        { id: "p22", categoria: "pluvial", nombre: "Canaleta", unidad: "m", precio: 0 },
        { id: "p23", categoria: "gas", nombre: 'Caño para gas 1/2" (galvanizado/cobre)', unidad: "m", precio: 0 },
        { id: "p24", categoria: "gas", nombre: "Llave de paso para gas", unidad: "u", precio: 0 },
        { id: "p25", categoria: "gas", nombre: "Regulador de gas", unidad: "u", precio: 0 },
        { id: "p26", categoria: "reparacion", nombre: "Visita / diagnóstico", unidad: "u", precio: 0 },
        { id: "p27", categoria: "reparacion", nombre: "Destape de cañería", unidad: "u", precio: 0 },
        { id: "p28", categoria: "reparacion", nombre: "Cambio de cuerpo de válvula/canilla", unidad: "u", precio: 0 },
        { id: "p29", categoria: "reparacion", nombre: "Reparación de pérdida", unidad: "u", precio: 0 },
        { id: "p30", categoria: "reparacion", nombre: "Cambio de flexible", unidad: "u", precio: 0 }
    ];

    function uid() {
        return `id-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
    }

    function money(n) {
        const v = Number(n) || 0;
        return v.toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 2 });
    }

    function blankQuote() {
        return {
            id: null,
            cliente: { nombre: "", direccion: "", telefono: "" },
            items: [],
            manoObra: [],
            traslado: 0,
            vigenciaDias: 15,
            heladas: false,
            notas: "",
            fecha: new Date().toISOString()
        };
    }

    function calcTotals(q) {
        const materiales = q.items.reduce((s, i) => s + (Number(i.cantidad) || 0) * (Number(i.precio) || 0), 0);
        const manoObra = q.manoObra.reduce((s, m) => s + (Number(m.monto) || 0), 0);
        const traslado = Number(q.traslado) || 0;
        return { materiales, manoObra, traslado, total: materiales + manoObra + traslado };
    }

    // ====== COMPONENTE DimDivider ======
    function DimDivider({ label }) {
        return React.createElement('div', { className: 'dim-divider' },
            React.createElement('span', { className: 'dim-tick' }),
            React.createElement('span', { className: 'dim-label' }, label),
            React.createElement('span', { className: 'dim-line' })
        );
    }

    // ====== ICONOS SVG ======
    const Icons = {
        Droplet: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M12 2C10 6 6 10 6 14a6 6 0 1012 0c0-4-4-8-6-12z" })),
        Flame: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.5-7S13 5 14 6c1-3 3-5 3-5s2 4 2 9a7 7 0 01-1.343 3.657z" })),
        Wrench: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9" })),
        Plus: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M12 4v16m8-8H4" })),
        Trash2: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" })),
        Printer: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" })),
        Save: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" })),
        AlertTriangle: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" })),
        Snowflake: () => React.createElement('svg', { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M12 4v16m4-12l-4 4m0 0l-4-4m4 4V4" })),
        Loader2: () => React.createElement('svg', { className: "w-4 h-4 animate-spin", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M12 4v4m0 4v4m4-12l-4 4m0 0l-4-4m4 4V4" }))
    };

    // ====== COMPONENTE PRINCIPAL ======
    function App() {
        const [loading, setLoading] = React.useState(true);
        const [tab, setTab] = React.useState("nuevo");
        const [status, setStatus] = React.useState(null);
        const [perfil, setPerfil] = React.useState({ nombre: "", matricula: "", localidad: "Abra Pampa, Jujuy" });
        const [precios, setPrecios] = React.useState(STARTER_PRICES);
        const [preciosDirty, setPreciosDirty] = React.useState(false);
        const [quotesIndex, setQuotesIndex] = React.useState([]);
        const [quote, setQuote] = React.useState(blankQuote());
        const [activeCategory, setActiveCategory] = React.useState(null);

        React.useEffect(() => {
            let alive = true;
            (async () => {
                try {
                    const p = storage.get(PERFIL_KEY);
                    if (alive && p) setPerfil(p);
                } catch (e) {}
                try {
                    const pr = storage.get(PRECIOS_KEY);
                    if (alive && pr) setPrecios(pr);
                    else storage.set(PRECIOS_KEY, STARTER_PRICES);
                } catch (e) {}
                try {
                    const idx = storage.get(INDEX_KEY);
                    if (alive && idx) setQuotesIndex(idx);
                } catch (e) {}
                if (alive) setLoading(false);
            })();
            return () => { alive = false; };
        }, []);

        function flash(type, msg) {
            setStatus({ type, msg });
            setTimeout(() => setStatus(null), 2500);
        }

        function savePerfil(next) {
            setPerfil(next);
            storage.set(PERFIL_KEY, next);
        }

        function guardarPrecios() {
            storage.set(PRECIOS_KEY, precios);
            setPreciosDirty(false);
            flash("ok", "Lista de precios guardada.");
        }

        function guardarPresupuesto() {
            const id = quote.id || uid();
            const toSave = { ...quote, id, fecha: quote.fecha || new Date().toISOString() };
            storage.set(`presupuesto-${id}`, toSave);
            const t = calcTotals(toSave);
            const meta = { id, cliente: toSave.cliente.nombre || "Sin nombre", fecha: toSave.fecha, total: t.total };
            const nextIndex = [meta, ...quotesIndex.filter(q => q.id !== id)];
            storage.set(INDEX_KEY, nextIndex);
            setQuotesIndex(nextIndex);
            setQuote(toSave);
            flash("ok", "Presupuesto guardado.");
        }

        function abrirPresupuesto(id) {
            try {
                const q = storage.get(`presupuesto-${id}`);
                if (q) {
                    setQuote(q);
                    setActiveCategory(null);
                    setTab("nuevo");
                }
            } catch (e) {
                flash("error", "No se pudo abrir el presupuesto.");
            }
        }

        function eliminarPresupuesto(id) {
            storage.delete(`presupuesto-${id}`);
            const nextIndex = quotesIndex.filter(q => q.id !== id);
            storage.set(INDEX_KEY, nextIndex);
            setQuotesIndex(nextIndex);
            if (quote.id === id) setQuote(blankQuote());
            flash("ok", "Presupuesto eliminado.");
        }

        function nuevoPresupuesto() {
            setQuote(blankQuote());
            setActiveCategory(null);
            setTab("nuevo");
        }

        function addItem(catItem) {
            setQuote(q => ({
                ...q,
                items: [...q.items, { id: uid(), categoria: catItem.categoria, nombre: catItem.nombre, unidad: catItem.unidad, cantidad: 1, precio: catItem.precio }]
            }));
        }

        function addCustomItem(categoria) {
            setQuote(q => ({
                ...q,
                items: [...q.items, { id: uid(), categoria, nombre: "", unidad: "u", cantidad: 1, precio: 0 }]
            }));
        }

        function updateItem(id, patch) {
            setQuote(q => ({ ...q, items: q.items.map(i => i.id === id ? { ...i, ...patch } : i) }));
        }

        function removeItem(id) {
            setQuote(q => ({ ...q, items: q.items.filter(i => i.id !== id) }));
        }

        function addManoObra() {
            setQuote(q => ({ ...q, manoObra: [...q.manoObra, { id: uid(), descripcion: "", monto: 0 }] }));
        }

        function updateManoObra(id, patch) {
            setQuote(q => ({ ...q, manoObra: q.manoObra.map(m => m.id === id ? { ...m, ...patch } : m) }));
        }

        function removeManoObra(id) {
            setQuote(q => ({ ...q, manoObra: q.manoObra.filter(m => m.id !== id) }));
        }

        function updatePrecio(id, patch) {
            setPrecios(p => p.map(x => x.id === id ? { ...x, ...patch } : x));
            setPreciosDirty(true);
        }

        function addPrecioRow(categoria) {
            setPrecios(p => [...p, { id: uid(), categoria, nombre: "", unidad: "u", precio: 0 }]);
            setPreciosDirty(true);
        }

        function removePrecioRow(id) {
            setPrecios(p => p.filter(x => x.id !== id));
            setPreciosDirty(true);
        }

        const totals = calcTotals(quote);
        const tieneGas = quote.items.some(i => i.categoria === "gas");

        function getIconForCategory(catId) {
            const cat = CATEGORIES.find(c => c.id === catId);
            if (!cat) return Icons.Wrench;
            switch (cat.icon) {
                case 'droplet': return Icons.Droplet;
                case 'flame': return Icons.Flame;
                default: return Icons.Wrench;
            }
        }

        // Renderizar el componente principal
        return React.createElement('div', { className: "min-h-screen paper-bg ff-body" },
            // Header
            React.createElement('header', { className: "rotulo" },
                React.createElement('div', { className: "max-w-5xl mx-auto px-4 py-4" },
                    React.createElement('div', { className: "flex items-center justify-between flex-wrap gap-3" },
                        React.createElement('div', null,
                            React.createElement('p', { className: "ff-display uppercase text-2xl tracking-wide" }, "Presupuestos · Plomería"),
                            React.createElement('p', { className: "ff-mono text-2xs opacity-70" }, "Herramienta de cálculo para instalaciones sanitarias en Jujuy")
                        ),
                        React.createElement('div', { className: "grid grid-cols-2 sm:grid-cols-3 gap-0 ff-mono text-2xs" },
                            React.createElement('div', { className: "rotulo-cell px-3 py-2" },
                                React.createElement('div', { className: "rotulo-label uppercase" }, "Nombre"),
                                React.createElement('input', {
                                    value: perfil.nombre,
                                    onChange: e => setPerfil({ ...perfil, nombre: e.target.value }),
                                    onBlur: () => savePerfil(perfil),
                                    placeholder: "Tu nombre",
                                    className: "bg-transparent outline-none w-full placeholder:opacity-40"
                                })
                            ),
                            React.createElement('div', { className: "rotulo-cell px-3 py-2" },
                                React.createElement('div', { className: "rotulo-label uppercase" }, "Matrícula"),
                                React.createElement('input', {
                                    value: perfil.matricula,
                                    onChange: e => setPerfil({ ...perfil, matricula: e.target.value }),
                                    onBlur: () => savePerfil(perfil),
                                    placeholder: "N° matrícula",
                                    className: "bg-transparent outline-none w-full placeholder:opacity-40"
                                })
                            ),
                            React.createElement('div', { className: "rotulo-cell px-3 py-2 col-span-2 sm:col-span-1" },
                                React.createElement('div', { className: "rotulo-label uppercase" }, "Localidad"),
                                React.createElement('input', {
                                    value: perfil.localidad,
                                    onChange: e => setPerfil({ ...perfil, localidad: e.target.value }),
                                    onBlur: () => savePerfil(perfil),
                                    className: "bg-transparent outline-none w-full"
                                })
                            )
                        )
                    ),
                    React.createElement('nav', { className: "flex gap-6 mt-4 border-t border-white/10 pt-2" },
                        React.createElement('button', {
                            'data-active': tab === "nuevo" ? "true" : "false",
                            className: "tab-btn pb-1 text-sm uppercase",
                            onClick: () => setTab("nuevo")
                        }, "Nuevo presupuesto"),
                        React.createElement('button', {
                            'data-active': tab === "precios" ? "true" : "false",
                            className: "tab-btn pb-1 text-sm uppercase",
                            onClick: () => setTab("precios")
                        }, "Lista de precios"),
                        React.createElement('button', {
                            'data-active': tab === "guardados" ? "true" : "false",
                            className: "tab-btn pb-1 text-sm uppercase",
                            onClick: () => setTab("guardados")
                        }, "Guardados (", quotesIndex.length, ")")
                    )
                )
            ),

            // Main
            React.createElement('main', { className: "max-w-5xl mx-auto px-4 py-6" },
                loading ?
                    React.createElement('div', { className: "flex items-center gap-2 text-gray-400 text-sm py-16 justify-center" },
                        React.createElement(Icons.Loader2, null), " Cargando..."
                    ) :
                    React.createElement(React.Fragment, null,

                className: `fixed bottom-4 right-4 px-4 py-2 rounded text-sm text-white shadow-lg ${status.type === "ok" ? "bg-emerald-600" : "bg-red-600"}`
            }, status.msg)
        );
    }

    // ====== RENDERIZADO ======
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
</script>

</body>
</html>
